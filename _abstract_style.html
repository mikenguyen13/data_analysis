<!-- Styling for the per-chapter abstract and keyword blocks required by the
     Springer manuscript guidelines. Delivered as a head include rather than
     through the bs4_book `css:` option so that bookdown's own stylesheet
     handling is left untouched. -->
<style>
.chapter-abstract {
  border-left: 3px solid #b8c4d0;
  background: #f7f9fb;
  padding: 0.85rem 1.1rem;
  margin: 1.25rem 0 1.75rem 0;
  font-size: 0.94em;
  line-height: 1.55;
}
.chapter-abstract p { margin-bottom: 0.6rem; }
.chapter-abstract p:last-child { margin-bottom: 0; }
</style>
